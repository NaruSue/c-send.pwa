name: Build and publish desktop wrapper

on:
  push:
    tags: ["wrap-v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing wrap-v* tag to build
        required: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: --target x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install JS dependencies
        working-directory: wrap
        run: npm install
      - name: Prepare app icons
        shell: bash
        run: |
          mkdir -p wrap/src-tauri/icons
          cp icon-192.png wrap/src-tauri/icons/tray.png
      - name: Generate bundle icons
        working-directory: wrap
        run: npx tauri icon ../icon-512.png
      - name: Check wrapper API payloads
        working-directory: wrap/src-tauri
        run: cargo test
      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: wrap
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: c-send ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            Desktop wrapper release. Fix remote PWA communication and add window menu controls. PWA API v1, PWA 0.2.3.
            macOS builds are not notarized; macOS may show a download warning.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Build Windows bridge check
        if: runner.os == 'Windows'
        working-directory: wrap/src-tauri
        run: cargo build --release --features ci-bridge-check,tauri/custom-protocol --target x86_64-pc-windows-msvc --target-dir ../../target-ci
      - name: Check real remote PWA to wrapper bridge
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CSEND_CI_BRIDGE_CHECK = '1'
          $env:CSEND_CI_TRAY_SHOW = '1'
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class TrayMenuCheck {
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindowW(string cls, string title);
            [DllImport("user32.dll")] public static extern IntPtr SendMessageW(IntPtr window, uint msg, IntPtr wparam, IntPtr lparam);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetMenuStringW(IntPtr menu, uint item, StringBuilder text, int max, uint flags);
          }
          '@
          $exe = (Resolve-Path 'target-ci/x86_64-pc-windows-msvc/release/c-send.exe').Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $passed = $false
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Bridge check exited: $($process.ExitCode)" }
              if ($process.MainWindowTitle -like 'CSEND_CI_BRIDGE_FAIL*') { throw $process.MainWindowTitle }
              if ($process.MainWindowTitle -eq 'CSEND_CI_BRIDGE_PASS') { $passed = $true; break }
            }
            if (-not $passed) { throw "Bridge check timed out: $($process.MainWindowTitle)" }
            $found = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              $popup = [TrayMenuCheck]::FindWindowW('#32768', $null)
              if ($popup -eq [IntPtr]::Zero) { continue }
              $menu = [TrayMenuCheck]::SendMessageW($popup, 0x1e1, [IntPtr]::Zero, [IntPtr]::Zero)
              $text = [System.Text.StringBuilder]::new(256)
              [void][TrayMenuCheck]::GetMenuStringW($menu, 0, $text, $text.Capacity, 0x400)
              if ($text.ToString() -eq '実画面の連携確認') { $found = $true; break }
            }
            if (-not $found) { throw 'Tray popup did not show the PWA item' }
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            Remove-Item Env:CSEND_CI_BRIDGE_CHECK -ErrorAction SilentlyContinue
            Remove-Item Env:CSEND_CI_TRAY_SHOW -ErrorAction SilentlyContinue
          }
      - name: Check Windows window state after forced exit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class WindowCheck {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr hWnd, IntPtr insertAfter, int x, int y, int cx, int cy, uint flags);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
            [DllImport("user32.dll")] public static extern IntPtr GetSystemMenu(IntPtr hWnd, bool revert);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetMenuStringW(IntPtr menu, uint item, StringBuilder text, int max, uint flags);
            [DllImport("user32.dll")] public static extern bool PostMessageW(IntPtr window, uint message, IntPtr wparam, IntPtr lparam);
            [DllImport("user32.dll")] public static extern IntPtr GetWindowLongPtrW(IntPtr window, int index);
          }
          '@
          function Wait-ForWindow($process) {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "c-send exited during startup: $($process.ExitCode)" }
              if ($process.MainWindowHandle -ne [IntPtr]::Zero) { return $process.MainWindowHandle }
            }
            throw 'c-send window did not appear'
          }
          $exe = (Resolve-Path 'wrap/src-tauri/target/x86_64-pc-windows-msvc/release/c-send.exe').Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $window = Wait-ForWindow $process
            Start-Sleep -Seconds 8
            $menu = [WindowCheck]::GetSystemMenu($window, $false)
            foreach ($entry in @(@(0x1100,'常に手前に表示'),@(0x1110,'アプリの更新を確認'),@(0x1120,'c-send wrap v0.0.6'))) {
              $text = [System.Text.StringBuilder]::new(128)
              [void][WindowCheck]::GetMenuStringW($menu, $entry[0], $text, $text.Capacity, 0)
              if ($text.ToString() -ne $entry[1]) { throw "Missing system menu item: $($entry[1])" }
            }
            $topBefore = [WindowCheck]::GetWindowLongPtrW($window, -20).ToInt64() -band 8
            [void][WindowCheck]::PostMessageW($window, 0x112, [IntPtr]0x1100, [IntPtr]::Zero)
            Start-Sleep -Seconds 2
            $topAfter = [WindowCheck]::GetWindowLongPtrW($window, -20).ToInt64() -band 8
            if ($topBefore -eq $topAfter) { throw 'Always-on-top menu did not change window state' }
            [void][WindowCheck]::PostMessageW($window, 0x112, [IntPtr]0x1100, [IntPtr]::Zero)
            Start-Sleep -Seconds 2
            if (-not [WindowCheck]::SetWindowPos($window, [IntPtr]::Zero, 120, 100, 360, 600, 0x0014)) { throw 'Could not move and resize window' }
            Start-Sleep -Seconds 5
            $before = New-Object WindowCheck+RECT
            if (-not [WindowCheck]::GetWindowRect($window, [ref]$before)) { throw 'Could not read initial window rectangle' }
            if (($before.Right - $before.Left) -gt 400) { throw 'Window cannot be resized to the requested narrow width' }
            $statePath = Join-Path $env:APPDATA 'org.c-send.desktop/.window-state.json'
            if (-not (Test-Path -LiteralPath $statePath)) { throw "Window state file was not saved: $statePath" }
            $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            Write-Host "Saved window state: $($state.main | ConvertTo-Json -Compress)"
            if (-not $state.main -or [Math]::Abs($state.main.x - $before.Left) -gt 16 -or [Math]::Abs($state.main.y - $before.Top) -gt 16) { throw 'Saved window state does not match the moved window' }
            Stop-Process -Id $process.Id -Force
            $process.WaitForExit()
            Start-Sleep -Seconds 3
            $process = Start-Process -FilePath $exe -PassThru
            $window = Wait-ForWindow $process
            Start-Sleep -Seconds 3
            $after = New-Object WindowCheck+RECT
            if (-not [WindowCheck]::GetWindowRect($window, [ref]$after)) { throw 'Could not read restored window rectangle' }
            foreach ($field in @('Left','Top','Right','Bottom')) {
              if ([Math]::Abs($before.$field - $after.$field) -gt 5) { throw "Window $field did not persist: $($before.$field) -> $($after.$field)" }
            }
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish release after all builds and smoke checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
